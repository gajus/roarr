jobs:
  test:
    runs-on: ubuntu-latest
    environment: release
    name: Test
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: setup repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Test, build and release
on:
  push:
    branches:
      - main
